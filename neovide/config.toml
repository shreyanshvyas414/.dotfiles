[settings]
neovim-args = ["--cmd", "set guifont=Maple\\ Mono\\ NF:h14"]

# ── FONT ───────────────────────────────────────────
font_size = 20.0

# fallback fonts (good for icons/emojis)
fallback_fonts = ["Apple Color Emoji"]

# ── WINDOW ─────────────────────────────────────────
remember_window_size = true
remember_window_position = true

# macOS fullscreen behavior
fullscreen = false

# padding (nice spacing)
padding_top = 10
padding_bottom = 10
padding_left = 10
padding_right = 10

# ── CURSOR ─────────────────────────────────────────
cursor_animation_length = 0.06
cursor_trail_size = 0.7
cursor_antialiasing = true
cursor_unfocused_outline_width = 0.125

# smooth cursor movement
cursor_vfx_mode = "sonicboom"   # try: pixiedust | sonicboom | torpedo

# ── SCROLLING ──────────────────────────────────────
scroll_animation_length = 0.2
scroll_animation_far_lines = 1

# ── PERFORMANCE ────────────────────────────────────
vsync = true
srgb = true
idle = true

# ── TRANSPARENCY / BLUR (macOS) ────────────────────
transparency = 0.95
blur = true

# ── INPUT ──────────────────────────────────────────
# macOS feel (Cmd instead of Ctrl where possible)
input_macos_alt_is_meta = true

# ── THEME / BACKGROUND ─────────────────────────────
# optional: background color override
# background_color = "#0f1117"

# ── MISC ───────────────────────────────────────────
hide_mouse_when_typing = true
refresh_rate = 120
