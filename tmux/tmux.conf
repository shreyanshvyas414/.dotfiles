# PREFIX
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# TERMINAL & PERFORMANCE
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB,xterm-kitty:RGB,xterm-ghostty:RGB"
set -g default-shell /bin/zsh
set -g history-limit 100000

# INDEXING & MOUSE
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# WINDOWS & SPLITS
bind t new-window -c "#{pane_current_path}"
bind x kill-window
bind r command-prompt -I "#W" "rename-window '%%'"

# Prefix + Arrow keys to split windows
bind Right split-window -h -c "#{pane_current_path}" \; select-pane -R
bind Left  split-window -hb -c "#{pane_current_path}" \; select-pane -L
bind Down  split-window -v -c "#{pane_current_path}" \; select-pane -D
bind Up    split-window -vb -c "#{pane_current_path}" \; select-pane -U
unbind '"'
unbind %

# NAVIGATION
# LAYER 2: TERMINAL / TMUX
# Alt + Arrow keys (without prefix) to switch panes
# (Works perfectly because AeroSpace doesn't intercept plain Alt+Arrow)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# RESIZE
# Ctrl + Shift + Arrow (without prefix) to resize panes
# (Works perfectly because it bypasses AeroSpace's Alt+Shift bindings)
bind -n C-S-Left resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up resize-pane -U 5
bind -n C-S-Down resize-pane -D 5

# Alternative: Prefix + Shift + Arrow to resize panes
# (Safe fallback because you release Alt before pressing Shift+Arrow)
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5

# (Note: Alt+Shift+Arrow resizing is explicitly removed because AeroSpace intercepts it)


# SESSION MANAGEMENT & UTILITIES
bind s choose-session
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
bind C-x confirm-before -p "kill-server? (y/n)" kill-server
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
bind b set -g status
bind-key -n M-BSpace send-keys C-w

# COPY MODE
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind p paste-buffer

# STATUS BAR (ROUNDED)
# HALF_ROUND_OPEN="#(printf '\uE0B6')"
# HALF_ROUND_CLOSE="#(printf '\uE0B4')"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default"
set -g status-left "#[fg=yellow,bold]󰉊 #S "
set -g status-justify absolute-centre
set -g window-status-current-format "#[fg=yellow]#[fg=black,bg=yellow,bold]#I:#W#[fg=yellow,bg=default]"
set -g window-status-style "fg=colour178,bg=default"
set -g status-right ""

# BORDERS & FEATURES
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=yellow
set -g allow-rename off
set -g focus-events on
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-bell-style "fg=red,bg=default,bold"
setw -g aggressive-resize on

# LAUNCHERS
# tmux as a launcher, not just a multiplexer. Each key opens a scratch window
# running a picker from ~/.config/scripts; the window closes when it exits.
# The pickers that need a TTY are wrapped in `tmux neww`; open-github is not.

# Project switcher: fuzzy-pick a directory, create-or-switch to its session.
bind f run-shell "tmux neww ~/.config/scripts/tmux-session-dispensary.sh"

# Run any script in the current project (-c gives the picker its cwd).
bind S run-shell "tmux neww -c '#{pane_current_path}' -n scripts ~/.config/scripts/script-picker.sh"

# Bookmarks from ~/.config/links.tsv (ctrl-y copies, ctrl-e edits the file).
bind O run-shell "tmux neww -n links ~/.config/scripts/links-picker.sh"

# Open this repo's origin remote in the browser.
bind g run-shell "~/.config/scripts/open-github.sh '#{pane_current_path}'"

# -S selects the window if it already exists instead of creating a duplicate.
bind G neww -n "git"  -S lazygit
bind y neww -n "yazi" -S yazi
